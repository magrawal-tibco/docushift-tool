#    Service Catalog EBX). Their folders were renamed under 50 characters on 14 Nov (Phase 80) in
#    local commits that are not pushed; staging cannot serve them until the R2 push. Re-verify
#    after the push, then delete or rewrite those entries. Lines 383-385 (Hawk microagents,
#    Kafka Schema Repository 2.1.0) match nothing now: those versions are served; delete them.
#
