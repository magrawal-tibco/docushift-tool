# DocuShift Publishing Configuration
#
# The naming tokens for the destination repositories, and nothing else. The
# *shape* of a tree name lives in `src/docushift/utils/slug.py`; this file owns
# only the words that go into it, so a rename is an edit here rather than a grep
# across the codebase. Supplied by the doc-platform owners, 2026-09-10 --
# see docs/planning.md Phase 3.8 and docs/architecture.md section 6.1.
#
#   families/en-us-tib-messaging/          <- local workspace (no suffix)
#   en-us-tib-messaging-userdocs           <- docs tree, primary locale
#   loc-tib-messaging-userdocs             <- docs tree, ALL other locales
#   en-us-tib-messaging-userdocs-resources <- API references and archives
#
# A missing file is not an error: every key below is also the built-in default,
# so a fresh checkout publishes to the documented names.

version: "1.0"

# `userdocs`, not `docs`: Javadoc and the C / Go / tibdg trees are documentation
# too, which is exactly why they route to the -resources tree instead. A suffix
# meaning "documentation" cannot separate them, so this one names the *audience*
# and `*-userdocs` then enumerates the published docs trees and nothing else.
#
# Must be a single lowercase token -- every other segment is hyphen-separated, so
# `user-docs` would make the family/suffix boundary unparseable. `catalog import`
# refuses a suffix with a hyphen in it.
docs_suffix: "userdocs"

# Appended to the docs tree name, never composed independently, so the two names
# cannot drift apart when `docs_suffix` changes.
resources_suffix: "resources"

# Replaces the locale segment for every non-primary locale: one tree carries all
# localized content, rather than one tree per language.
localized_prefix: "loc"

# Language-region, matching the inner path segment. The only locale in scope.
# A locale other than this one selects the `loc-` docs tree and gets no
# `-resources` sibling at all.
primary_locale: "en-us"

# The published host, for the one link that cannot be relative: a help topic
# pointing into an api-reference tree crosses from the docs repository into the
# -resources one, and a relative path cannot span two repositories.
#
# **Empty is a supported state and is the shipped value.** The AEM host is not
# known yet. Until it is, `convert` writes those links as tree-rooted paths with
# no scheme or host (a prefix to add later), and `sync` warns
# (`PUBLISH_BASE_URL_UNSET`) once per version whose API tree it copies -- it does
# not fail the run and it does not guess a host. The published 301 maps carry no
# host either; setting one later replaces their rows rather than adding to them. Only 13 of the 422 products a full sync
# selects have an api-reference tree at all.
#
# Must be absolute (`https://...`) when set; `catalog validate` says so, because
# this value is concatenated into every cross-tree link without further checking.
publish_base_url: ""

# How long the folder the published repos live in is, counted the way Windows
# counts a path (drive letter and separators included). 24 is
# `C:\github\tibco-docs-aem`. `convert` cannot see `sync`'s `--target-dir`, so it
# uses this to find the rare image whose published path would pass 260
# characters, and copies that one under a shorter name (planning.md Phase 49).
# `sync` still measures the real path and refuses what is over. 0 turns the
# shortening off.
published_root_length: 24

# The staging host `docushift verify` compares the published trees against, per
# business unit (planning.md Phases 55, 58): a product is checked against its own
# BU's site and never another's. Kept apart from `publish_base_url` on purpose:
# that one is written into links, and a check must never change what is published.
# `--base-url` overrides it for one run. A BU with no entry gets no staging check.
verify_base_urls:
  ibi: "https://stg-docs.ibi.com"
  # Uncomment once stg-docs.tibco.com has real content (it had none on 2026-10-23);
  # until then every TIBCO page would read as "not served".
  # tibco: "https://stg-docs.tibco.com"
