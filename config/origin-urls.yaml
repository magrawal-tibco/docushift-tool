# Origin URLs -- where a converted topic is served on docs.tibco.com **today**
# (docs/planning.md Phase 22).
#
# This file exists so the 301 map can start where the reader does. Every other
# redirect artifact in the tree is expressed in coordinates this tool invented;
# these are the live addresses that stop working at cutover, and they are the
# only half of a redirect row that cannot be derived from the output.
#
# **Declared per product, never inferred, and that is the whole point.** Grouping
# `output_map` by the first two segments of its source paths across the converted
# catalog returns four different layouts:
#
#   <package-root>/html/...       tibco-enterprise-message-service, tibco-streaming
#   html/...                      spotfire-data-science-author
#   doc/html/...                  tibco-datasynapse-gridserver-logviewer
#   <package-root>/designerhelp/  tibco-runtime-agent
#
# One rule applied to all four emits confident, wrong URLs for three of them, and a
# wrong 301 is strictly worse than a missing one: the reader lands on a dead page
# and the run reports success. So a product absent from this file gets no `301.yml`
# and is named in the run report as ORIGIN_TEMPLATE_UNDECLARED. Adding a product
# means checking one of its URLs against the live site and writing the answer here.
#
# **Phase 33: most products no longer need an entry here.** When `catalog sitemap`
# has cached a version's Coveo sitemap, Reframe derives the template from it and
# writes only the rows the sitemap lists (origins.derive). An entry here still
# wins over the derivation and writes every row -- declare a product when the
# derivation is wrong or the docsite lists no pages for it.
#
# Per product:
#   template       The served URL, with `{folder_path}` (the directory part of the
#                  version's `zip_url` under `/pub/`, e.g. `ems/10.5.1`) and
#                  `{path}` (the source path, after `drop_segments` are removed).
#   drop_segments  Leading segments of the recorded source path to discard before
#                  substituting `{path}`. The package wrapper directory is one;
#                  a tree whose paths already start at the served root is zero.
#   verified       The exact URL that was fetched to confirm the template, and when.
#                  Not read by the code. It is here because the next person to add a
#                  product needs to know that "verified" meant a live request and not
#                  a pattern that looked right.

version: "1.0"

products:
  # The pilot doc set. Source paths are recorded as
  #   tibco-enterprise-message-service-10-5-1/html/_shared/about-this-product.htm
  # and the package wrapper is the one segment to drop, leaving `html/...` under
  # `/pub/ems/10.5.1/doc/`.
  tibco-enterprise-message-service:
    template: "https://docs.tibco.com/pub/{folder_path}/doc/{path}"
    drop_segments: 1
    verified: "https://docs.tibco.com/pub/ems/10.5.1/doc/html/_shared/about-this-product.htm (2026-09-28, serves 'About this Product')"

  # DSML Services 1.0.7 has no page list in the docsite sitemap (checked by the user,
  # 2026-10-25), so nothing derived a 301.yml for it. Its package records sources as
  # `doc/html/...` where the others record `<package-root>/html/...`: one wrapper
  # segment either way. Against the seven versions that do have a sitemap this
  # template gives every listed URL and no other (17/17 ... 24/24), so they are
  # unchanged. **Not fetched live for 1.0.7**: built from the package layout at the
  # user's direction; check one URL before cutover.
  ibi-webfocus-dsml-services-container-edition:
    template: "https://docs.tibco.com/pub/{folder_path}/doc/{path}"
    drop_segments: 1
    verified: "against the sitemaps of 1.0.4-1.0.6 and 9.3.5-9.3.8 (2026-10-25); 1.0.7 not fetched"

  # Scribe Online is not on docs.tibco.com: its help is served from its own host, and
  # its package was obtained by hand (DOCOPS-302). Source paths are recorded from the
  # help root (`home/scr_features.htm`), so nothing is dropped. The live site opens
  # topics in a frameset (`index.htm#home/scr_features.htm`); a fragment never reaches
  # a server, so the redirect source is the topic's own address. The rows take effect
  # only once help.scribesoft.com's ownership is transferred to us (decided 2026-10-30).
  tibco-scribe:
    template: "https://help.scribesoft.com/scribe/en/{path}"
    drop_segments: 0
    verified: "user-confirmed direct topic URL https://help.scribesoft.com/scribe/en/sol/general/whitelist_reqs.htm (2026-10-30)"

  # -- DOCOPS-354 / DOCOPS-322 (2026-11-16): published versions whose 301.yml had
  # document rows only. Each template was checked in memory against the cached
  # Coveo sitemap (origins.listing) and the state.db output map, not fetched live;
  # counts and samples in reports/redirects/origin-templates-2026-11-16.md. An
  # entry applies to every version of the product, so each was also checked
  # against that product's other converted versions.

  # 1.1.0: derivation placed 32 of 36 topics (under the 90% bar); this template
  # is the one it found. The 4 others (deploying-activation-service, upgrading-
  # your-tibco-products, product-releases-that-support-activation[-outage]) are
  # in the package but not the sitemap, and are written anyway. 1.0.0 derives
  # this same template; declaring it adds its 2 unlisted rows.
  tibco-activation-service:
    template: "https://docs.tibco.com/pub/{folder_path}/doc/{path}"
    drop_segments: 1
    verified: "https://docs.tibco.com/pub/tibco-activation/1.1.0/doc/html/user-guide/license-command.htm (DOCOPS-322 sheet, 2026-11-04); 32/36 in the 1.1.0 sitemap, 2026-11-16"

  # The docsite serves one Flare output twice, under doc/bcis/html and
  # doc/bcgs/html, so the derivation tied (524 vs 524) and wrote nothing. bcis
  # is the copy the DOCOPS-322 sheet confirmed. The bcgs URLs cannot be mapped
  # by a one-template entry and stay unmapped (ORIGIN_PAGE_UNMAPPED).
  tibco-businessconnect:
    template: "https://docs.tibco.com/pub/{folder_path}/doc/bcis/{path}"
    drop_segments: 1
    verified: "https://docs.tibco.com/pub/bc/7.5.0/doc/bcis/html/script-deploy-user/Starting_bcappmanage_.htm (DOCOPS-322 sheet, 2026-11-04); 7.4.0 and 7.5.0 every topic in the sitemap, 2026-11-16"

  # 11.1.0 lists a second copy of Install-config-guide pages under
  # doc/Custom-installation/, so "drop 2" ran second at 2549 of 2688 and the
  # margin failed. This is the mapping that places all 2688 and reproduces the
  # page rows of the hand-restored published map; 9.3.2, 10.0.0 and 11.0.0
  # already derive it, so their rows do not change.
  tibco-mdm:
    template: "https://docs.tibco.com/pub/{folder_path}/doc/{path}"
    drop_segments: 1
    verified: "11.1.0: 2688/2688 in the sitemap and equal to the published 301.yml page rows (origin/wip ccabb06), 2026-11-16"
