# Reframe -- Stage 6b editorial policy (docs/REFRAME-REQUIREMENTS.md, planning.md Phase 20).
#
# Reframe merges granular MadCap Flare topics into fewer, larger pages, each former
# topic becoming an anchored `##` section. It runs only for the Flare engine, reads
# Stage 6's `output/` tree, and writes a sibling `reframed/` tree -- never its input.
#
# This file carries the editorial judgement. It is expected to be tuned repeatedly,
# which is exactly why it is a file and not a constant in the packer: a boundary pass
# should not be a code change.

defaults:
  # A cap, not a target (R1.2). Subtree cohesion chooses the boundary; this only
  # refuses a join that would cross it. A single source topic larger than the cap is
  # never split -- it becomes an oversized page and is flagged for a writer.
  #
  # Measured over the reference corpus (EMS 10.5.1, 1,441 topics, 226,871 words):
  #   2000 -> 171 pages, median 1,459 words    4000 ->  92 pages, median 3,030 words
  #   3000 -> 113 pages, median 2,226 words    6000 ->  60 pages, median 4,312 words
  max_words: 3000

  # Which `toc.yml` dialect to parse with. Empty means "ask the registered adapters
  # which one matches", which is right for every set measured so far. Name a schema
  # only to override a detection that guessed wrong -- an unrecognised shape is a
  # REFRAME_TOC_SCHEMA_UNKNOWN error, never a silent partial parse.
  toc_schema: ""

  # Whether `docushift sync` publishes the *merged* tree for this product instead of
  # Stage 6's. Off as the default, and overridden for exactly one product below:
  # `tibco-enterprise-message-service`, the pilot doc set, signed off 2026-09-25.
  #
  # This is the writer sign-off gate. Merging is reversible right up until the moment
  # a merged page is served under an old topic's URL, and after that it is not: the
  # redirects are live and the pages have been hand-edited. So publishing is not a
  # property of an invocation -- a `--reframed` flag would be re-decided by whoever
  # next runs `sync --all` -- it is a property of the doc set, recorded here, where
  # turning it on is a reviewable and revertable commit.
  #
  # Turn it on for a product only after a writer has worked its `review-queue.csv`.
  # `sync` then refuses to publish that product at all if the merged tree is missing
  # or older than the conversion beneath it, rather than quietly falling back to the
  # unmerged pages -- which would un-merge URLs that are already live.
  publish: false

  # A writer's answer to `review-queue.csv` (20e). Source paths -- topics, or
  # directories of them -- whose content must *not* be merged: each one stays the
  # single page Stage 6 made it. This is the one setting that undoes a merge for
  # part of a doc set without moving `max_words` and re-laying out every page.
  #
  # Write the path as it appears in `reframe.yml`'s `sections[].source` -- a file
  # with its `.md`, a directory without one. Matching is on whole path segments,
  # so `users-guide/monitor` takes the *directory* `users-guide/monitor/` and
  # never `users-guide/monitor.md` or `users-guide/monitoring.md`. Nothing is
  # guessed from a bare stem, because `users-guide/monitor` would then name two
  # different things depending on what happened to be on disk.
  #
  # A path that matches nothing is `REFRAME_KEEP_SEPARATE_UNMATCHED`, which is
  # what makes the strictness safe: forget the `.md` and the run tells you, where
  # a looser rule would quietly take out a directory you did not mean.
  #
  # Empty everywhere: nobody has worked a queue yet. Set it per product below,
  # not here -- the topics are one doc set's.
  keep_separate: []

products:
  # R1.4 -- layout pinning. This product has six convert-eligible Flare versions
  # (10.4.0, 10.4.1, 10.4.3, 10.4.4, 10.5.0, 10.5.1), so an unpinned merge would lay
  # each one out by its own subtree sizes and the versions would stop being diffable.
  # Pinned to the newest, which is the version the requirements' baseline was
  # measured against and the one `iter_versions` yields first.
  # Signed off 2026-09-25: the 18-row review queue was read and every page was
  # accepted as merged, so no `keep_separate` entries. The merged pages are now
  # what `sync` publishes for this product, under the 8,639-row redirect map.
  # Reverting is the inverse commit plus a `sync` -- cheap until the redirects are
  # served, and not cheap afterwards.
  tibco-enterprise-message-service:
    pin_layout_to: "10.5.1"
    publish: true

  # The other three multi-version Flare sets, pinned on the same rule -- the newest
  # eligible version, which is the one `iter_versions` yields first and the one a
  # fix gets written against. The remaining Flare products have a single eligible
  # version each and are left unpinned rather than pinned to themselves;
  # `REFRAME_LAYOUT_UNPINNED` will name them if a second version ever arrives.
  #
  # Six convert-eligible Flare versions. Unpinned, the same
  # 322-330 topics came out as 46, 56, 56, 51, 47 and 47 pages sharing 41 names at
  # worst; projected onto 5.2.0 they are 46, 53, 53, 52, 50 and 50, and no page is
  # grouped differently from the reference (Phase 26).
  # Signed off 2026-09-29: the 87-row review queue across the six versions was
  # accepted as merged, so no `keep_separate` entries. The merged pages are now
  # what `sync` publishes for this product. The sign-off was given after the
  # 29 Sep conversion fixes (Phase 27 -- skipped heading levels and class-named
  # definition terms), and re-merging with those in place moved no page boundary.
  #
  # Re-cut again 2026-09-30 by Phase 28's parent-leads packer, which *did* move
  # every boundary: 56/61/61/61/60/60 against the 46/53/53/52/50/50 above. The
  # queue came back at the same 87 rows and the sign-off was not re-taken, which
  # is worth knowing if a page reads oddly -- what was accepted was the merge, not
  # these particular boundaries.
  tibco-activespaces-enterprise-edition:
    pin_layout_to: "5.2.0"
    publish: true

  # Pinned, but neither has a convert-eligible version on disk yet, so the pin first
  # takes effect the run after they are converted.
  tibco-datasynapse-gridserver-manager:
    pin_layout_to: "7.2.0"

  tibco-datasynapse-high-performance-computing-cloud-adapter:
    pin_layout_to: "2.2.0"
