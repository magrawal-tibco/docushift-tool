# Reframe -- Stage 6b editorial policy (docs/REFRAME-REQUIREMENTS.md, planning.md Phase 20).
#
# Reframe merges granular MadCap Flare and DITA topics into fewer, larger pages, each
# former topic becoming an anchored `##` section. It runs only for those two engines
# (Phase 42), reads Stage 6's `output/` tree, and writes a sibling `reframed/` tree --
# never its input.
#
# This file carries the editorial judgement. It is expected to be tuned repeatedly,
# which is exactly why it is a file and not a constant in the packer: a boundary pass
# should not be a code change.

defaults:
  # A cap, not a target (R1.2). Subtree cohesion chooses the boundary; this only
  # refuses a join that would cross it. A single source topic larger than the cap is
  # never split -- it becomes an oversized page and is flagged for a writer.
  #
  # Measured over the reference corpus (EMS 10.5.1, 1,441 topics, 226,871 words):
  #   2000 -> 171 pages, median 1,459 words    4000 ->  92 pages, median 3,030 words
  #   3000 -> 113 pages, median 2,226 words    6000 ->  60 pages, median 4,312 words
  max_words: 3000

  # Which `toc.yml` dialect to parse with. Empty means "ask the registered adapters
  # which one matches", which is right for every set measured so far. Name a schema
  # only to override a detection that guessed wrong -- an unrecognised shape is a
  # REFRAME_TOC_SCHEMA_UNKNOWN error, never a silent partial parse.
  toc_schema: ""

  # Whether `docushift sync` publishes the *merged* tree for this product instead of
  # Stage 6's. Off as the default; on for the TIBCO BU below (Phase 42), off again for
  # its Streaming family. A version of an engine Reframe does not merge (WebWorks and
  # the rest) publishes its converted tree whatever this says.
  #
  # This was the writer sign-off gate, one product at a time. Merging is reversible right up until the moment
  # a merged page is served under an old topic's URL, and after that it is not: the
  # redirects are live and the pages have been hand-edited. So publishing is not a
  # property of an invocation -- a `--reframed` flag would be re-decided by whoever
  # next runs `sync --all` -- it is a property of the doc set, recorded here, where
  # turning it on is a reviewable and revertable commit.
  #
  # Until Phase 42 it was turned on for a product only after a writer had worked its
  # `review-queue.csv`. On 2026-10-06 the user's decision to merge every TIBCO doc set
  # except Streaming took the place of those per-product sign-offs; the queues are
  # still written, for writers to work later. For a Flare or DITA version, `sync` then
  # refuses to publish that product at all if the merged tree is missing
  # or older than the conversion beneath it, rather than quietly falling back to the
  # unmerged pages -- which would un-merge URLs that are already live.
  publish: false

  # A writer's answer to `review-queue.csv` (20e). Source paths -- topics, or
  # directories of them -- whose content must *not* be merged: each one stays the
  # single page Stage 6 made it. This is the one setting that undoes a merge for
  # part of a doc set without moving `max_words` and re-laying out every page.
  #
  # Write the path as it appears in `reframe.yml`'s `sections[].source` -- a file
  # with its `.md`, a directory without one. Matching is on whole path segments,
  # so `users-guide/monitor` takes the *directory* `users-guide/monitor/` and
  # never `users-guide/monitor.md` or `users-guide/monitoring.md`. Nothing is
  # guessed from a bare stem, because `users-guide/monitor` would then name two
  # different things depending on what happened to be on disk.
  #
  # A path that matches nothing is `REFRAME_KEEP_SEPARATE_UNMATCHED`, which is
  # what makes the strictness safe: forget the `.md` and the run tells you, where
  # a looser rule would quietly take out a directory you did not mean.
  #
  # Empty everywhere: nobody has worked a queue yet. Set it per product below,
  # not here -- the topics are one doc set's.
  keep_separate: []

  # Phase 63. `merge: false` keeps a doc set one page per TOC row -- the BU's
  # decision for ibi, Streaming and Data Virtualization -- while the stage still
  # names the pages, lays the folders out as the TOC and writes the redirects,
  # which AEM needs whatever the merge. WebWorks and DocBook are never merged.
  merge: true

  # Phase 63's rollout switch. On for a family, its unmerged versions (above, or
  # WebWorks and DocBook) go through `reframe`, and where `publish` is on, `sync`
  # publishes that tree and refuses a missing or stale one. Off, they are skipped
  # and publish their converted tree. Turned on family by family after the pilot.
  toc_folders: false

# Phase 42. Two levels between `defaults` and `products`, each overriding the one
# before, key by key: defaults, then the BU, then the family, then the product. A
# product line still wins, so one doc set can be held back with `publish: false`.
bus:
  # The user's decision, 2026-10-06: merged pages are the TIBCO default. IBI stays
  # unmerged.
  tibco:
    publish: true
  ibi:
    merge: false
families:
  # The one TIBCO family left out of that decision.
  streaming:
    publish: false
    merge: false
  # Spotfire's Data Virtualization, published unmerged (Phase 63). Laid out as its
  # TOC from its first publish, 2026-10-26 (DOCOPS-254).
  data-virtualization:
    merge: false
    publish: true
    toc_folders: true
  # Phase 63 rollout (DOCOPS-274), 2026-10-24: the first family laid out as its TOC,
  # after the WFCE 9.3.7/9.3.8 pilot. `sync` publishes the reframed tree and refuses
  # a version without one.
  container-editions:
    publish: true
    toc_folders: true
  # The second family, 2026-10-25, on the branch phase63-webfocus. Translated
  # trees (`--locale`) still publish their converted layout.
  webfocus:
    publish: true
    toc_folders: true
  # The rest of ibi, 2026-10-25, each on its repo's phase63-<family> branch.
  # Legacy is left off: it publishes PDFs only, so there is nothing to lay out.
  wf-reporting-server:
    publish: true
    toc_folders: true
  focus:
    publish: true
    toc_folders: true
  di-ism:
    publish: true
    toc_folders: true
products:
  # R1.4 -- layout pinning. This product has six convert-eligible Flare versions
  # (10.4.0, 10.4.1, 10.4.3, 10.4.4, 10.5.0, 10.5.1), so an unpinned merge would lay
  # each one out by its own subtree sizes and the versions would stop being diffable.
  # Pinned to the newest, which is the version the requirements' baseline was
  # measured against and the one `iter_versions` yields first.
  # Signed off 2026-09-25: the 18-row review queue was read and every page was
  # accepted as merged, so no `keep_separate` entries. The merged pages are now
  # what `sync` publishes for this product, under the 8,639-row redirect map.
  # Reverting is the inverse commit plus a `sync` -- cheap until the redirects are
  # served, and not cheap afterwards.
  tibco-enterprise-message-service:
    pin_layout_to: "10.5.1"
    publish: true
    # Phase 78 (2026-11-13, DOCOPS-367): pages by menu depth, 10.5.1 only. Each
    # entry lays one guide or chapter out with no word cap: depth 1 = one page,
    # depth 2 = the chapter's own page then one page per section with everything
    # under it, depth 3 = one level further. Chosen by judgement (planning.md
    # Phase 78); a chapter kept whole is listed too, so this list is the record.
    # Titles are matched exactly as toc.yml spells them, so two are escaped:
    # "REST\u00a0Proxy" has a no-break space and "XA\u2014External ..." an em dash.
    # A title that matches nothing is REFRAME_DEPTH_UNMATCHED; 10.5.1 is then not merged.
    # 10.4.0-10.5.0 keep their R1 layout: they project onto 10.5.1 packed by R1.
    depth:
      - {guide: "Installation", depth: 1, versions: ["10.5.1"]}
      # User Guide, one page per section.
      - {guide: "User Guide", chapter: "Messages", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Destinations", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Running the EMS Server", depth: 2, versions: ["10.5.1"]}
      # The command listing is one section: one reference page, a heading per command.
      - {guide: "User Guide", chapter: "Using the EMS Administration Tool", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "REST\u00a0Proxy", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Authentication and Permissions", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "JAAS Authentication Modules", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "FTL Stores", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Developing an EMS Client Application", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Monitor Server Activity", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Fault Tolerance", depth: 2, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Routes", depth: 2, versions: ["10.5.1"]}
      # User Guide, one page per subsection: per tibemsd.conf parameter group and
      # per other configuration file.
      - {guide: "User Guide", chapter: "Configuration Files", depth: 3, versions: ["10.5.1"]}
      # User Guide, whole chapters.
      - {guide: "User Guide", chapter: "Overview", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Getting Started", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Extensible Security", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "The EMS Implementation of JNDI", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Interoperation with Apache Pulsar", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Interoperation with Apache Kafka", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Interoperation with TIBCO FTL", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Interoperation with TIBCO Rendezvous", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "TLS Protocol", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Conversion of Server Configuration Files to JSON", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Appendix A: License Caching and Expiration", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Appendix B: Monitor Messages", depth: 1, versions: ["10.5.1"]}
      - {guide: "User Guide", chapter: "Appendix C: Error and Status Messages", depth: 1, versions: ["10.5.1"]}
      # C and COBOL Reference, one page per C type.
      - {guide: "C and COBOL Reference", chapter: "Messages", depth: 2, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Connection", depth: 2, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Connection Factory", depth: 2, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Session", depth: 2, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Administration", depth: 2, versions: ["10.5.1"]}
      # C and COBOL Reference, whole chapters (each under 5,000 words).
      - {guide: "C and COBOL Reference", chapter: "Introduction", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Destination", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Consumer", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Producer", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Requestor", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Queue Browser", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Name Server Lookup", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "XA\u2014External Transaction Manager", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Types", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Utilities", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "Exception", depth: 1, versions: ["10.5.1"]}
      - {guide: "C and COBOL Reference", chapter: "IBM z/OS and IBM i", depth: 1, versions: ["10.5.1"]}

  # The other three multi-version Flare sets, pinned on the same rule -- the newest
  # eligible version, which is the one `iter_versions` yields first and the one a
  # fix gets written against. Since Phase 42 a multi-version Flare or DITA product
  # with no line here is pinned the same way automatically, and
  # `REFRAME_LAYOUT_UNPINNED` (a note) names the version chosen. Writing the pin
  # here freezes it: left automatic, a newer version arriving re-cuts the older ones.
  #
  # Six convert-eligible Flare versions. Unpinned, the same
  # 322-330 topics came out as 46, 56, 56, 51, 47 and 47 pages sharing 41 names at
  # worst; projected onto 5.2.0 they are 46, 53, 53, 52, 50 and 50, and no page is
  # grouped differently from the reference (Phase 26).
  # Signed off 2026-09-29: the 87-row review queue across the six versions was
  # accepted as merged, so no `keep_separate` entries. The merged pages are now
  # what `sync` publishes for this product. The sign-off was given after the
  # 29 Sep conversion fixes (Phase 27 -- skipped heading levels and class-named
  # definition terms), and re-merging with those in place moved no page boundary.
  #
  # Re-cut again 2026-09-30 by Phase 28's parent-leads packer, which *did* move
  # every boundary: 56/61/61/61/60/60 against the 46/53/53/52/50/50 above. The
  # queue came back at the same 87 rows and the sign-off was not re-taken, which
  # is worth knowing if a page reads oddly -- what was accepted was the merge, not
  # these particular boundaries.
  tibco-activespaces-enterprise-edition:
    pin_layout_to: "5.2.0"
    publish: true

  # Pinned, but neither has a convert-eligible version on disk yet, so the pin first
  # takes effect the run after they are converted.
  tibco-datasynapse-gridserver-manager:
    pin_layout_to: "7.2.0"

  tibco-datasynapse-high-performance-computing-cloud-adapter:
    pin_layout_to: "2.2.0"

  # Phase 69 (2026-10-29). 4.2.0 and 4.3.0 online help could not publish: 115 and
  # 187 pages past 259 characters. The four guide folders took up to 38 of them on
  # every chain (`-2` because the main guide's title repeats the product landing
  # page's). Short names here first, then Phase 63's cut: every page fits, 251 and
  # 311 pages renamed. 4.2.0 has no installation guide (a note, not a fault).
  tibco-activematrix-bpm:
    guide_names:
      tibco-activematrix-bpm-2: bpm
      tibco-activematrix-bpm-installation: installation
      tibco-activematrix-bpm-soa-development: soa-development
      tibco-activematrix-bpm-tutorials: tutorials

  # Phase 76 (2026-11-09, DOCOPS-336). *Activation Setup* is a numbered procedure,
  # and R1 had put Steps 1-3 on one page titled "Step 1" and Steps 4-5 on one titled
  # "Step 4". The user asked for one step per page here, keeping R1 for everyone
  # else. Steps 1, 3 and 5 are listed; Steps 2 and 4 then sit alone between them
  # and keep their own sub-topics. Listing 2 or 4 would split those off too.
  # 1.1.0 only: 1.0.0 numbers its steps differently (Step 1 has the sub-topics;
  # four steps), and the split projected onto it put Step 1's sub-topics on a page
  # named after 1.1.0's Step 2. 1.0.0 keeps its 16 published pages.
  # 1.1.0 was on staging (synced 2026-11-05): this split is the one approved
  # exception to the no-regrouping rule (open-issues.md).
  # DOCOPS-354 (2026-11-12): the rebuild under the 3.0.1 pin folded each SQL Direct
  # activity into a sibling activity's page; 2.26.8 is published with them as pages
  # of their own, which is right. Version-scoped, so 3.0.1 keeps its digest.
  tibco-flogo:
    keep_separate:
      - path: connectors/oracledb/oracle-database-sql-direct.md
        versions: ["2.26.8"]
      - path: connectors/mysql/mysql-direct.md
        versions: ["2.26.8"]

  tibco-activation-service:
    keep_separate:
      - path: user-guide/planning-for-license-activation.md
        versions: ["1.1.0"]
      - path: user-guide/generating-licenses.md
        versions: ["1.1.0"]
      - path: user-guide/upgrading-your-tibco-products.md
        versions: ["1.1.0"]
