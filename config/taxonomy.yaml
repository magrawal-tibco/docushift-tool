# DocuShift Product Taxonomy Configuration
#
# This file defines WHICH FAMILIES EXIST and THE KEYWORD RULES used to guess them.
# It does NOT list individual products -- per-product bu/family assignment lives in
# config/products.csv, where it can be bulk-edited in a spreadsheet.
#
# It also carries no engine information: the source toolchain differs between
# versions of the same product, so it is detected per version from the extracted
# package. See docs/architecture.md sections 3.3 and 3.4.
#
# `repo_slug` is optional on a business unit and on a family: the short token that
# names the workspace folder and the publishing repositories, defaulting to the
# slugified key when absent. It is a *publishing* concern and deliberately does not
# reshape the catalog -- family keys, products.csv and the keyword rules below are
# unaffected by it. Two families in one BU may not share one, since they would then
# publish into a single repository. See docs/planning.md Phase 3.8.

version: "1.0"

business_units:
  tibco:
    name: "TIBCO"
    # `en-us-tib-messaging-userdocs`, not `en-us-tibco-...` -- the doc platform's
    # naming, on names that already carry a median-39-character product slug.
    repo_slug: "tib"
    families:
      integration:
        name: "Integration"
        description: "Application integration, API management, and event-driven architecture"
      messaging:
        name: "Messaging"
        description: "High-performance messaging, streaming, and pub-sub"
      analytics:
        name: "Analytics"
        description: "Visual analytics, data science, and streaming analytics"
      data_management:
        name: "Data Management"
        description: "Master data management and data virtualization"
      bpm:
        name: "Business Process Management"
        description: "Process automation, case management, and workflow"
      general:
        name: "General"
        description: "Not yet triaged into a family"

  ibi:
    name: "ibi"
    families:
      webfocus:
        name: "WebFOCUS"
        description: "Business intelligence and enterprise reporting"
      data_management:
        name: "Data Management & Quality"
        description: "Omni-Gen and iWay data quality solutions"
      general:
        name: "General"
        description: "Not yet triaged into a family"

# Keyword inference. First match wins, so order matters -- put the specific rules
# above the broad ones. Each `match` token is compared case-insensitively against:
#   * the product_code, as an exact match; and
#   * the display name, as a substring.
# A product matching no rule is written as family_source=unclassified for manual
# triage. Rules never assign `engine`.
rules:
  # -- ibi ----------------------------------------------------------------
  - match: ["webfocus", "webfocus-app-studio", "webfocus-client", "webfocus-reporting-server"]
    bu: ibi
    family: webfocus
  - match: ["omni-gen", "omni-healthdata", "omni gen", "omni-healthdata", "iway", "dqm", "data quality center"]
    bu: ibi
    family: data_management

  # -- TIBCO messaging ----------------------------------------------------
  - match: ["ems", "enterprise message service", "ftl", "rendezvous", "activespaces"]
    bu: tibco
    family: messaging

  # -- TIBCO integration --------------------------------------------------
  - match:
      - "businessevents-enterprise"
      - "businessevents"
      - "bw"
      - "bwce"
      - "businessworks"
      - "flogo"
      - "api-exchange"
      - "api exchange"
    bu: tibco
    family: integration

  # -- TIBCO analytics ----------------------------------------------------
  - match: ["spotfire", "streambase", "statistica"]
    bu: tibco
    family: analytics

  # -- TIBCO data management ----------------------------------------------
  - match: ["ebx", "mdm", "tdv", "data virtualization"]
    bu: tibco
    family: data_management

  # -- TIBCO BPM ----------------------------------------------------------
  - match: ["activematrix-bpm", "iprocess", "nimbus"]
    bu: tibco
    family: bpm

  # -- ibi catch-all ------------------------------------------------------
  # Deliberately last: broad enough to misfire against a more specific rule above.
  - match: ["ibi"]
    bu: ibi
    family: general
