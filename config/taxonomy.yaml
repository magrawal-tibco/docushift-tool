# DocuShift Product Taxonomy Configuration
#
# This file defines WHICH FAMILIES EXIST and THE KEYWORD RULES used to guess them.
# It does NOT list individual products -- per-product bu/family assignment lives in
# config/products.csv, where it can be bulk-edited in a spreadsheet.
#
# It also carries no engine information: the source toolchain differs between
# versions of the same product, so it is detected per version from the extracted
# package. See docs/architecture.md sections 3.3 and 3.4.
#
# `repo_slug` is optional on a business unit and on a family: the short token that
# names the workspace folder and the publishing repositories, defaulting to the
# slugified key when absent. It is a *publishing* concern and deliberately does not
# reshape the catalog -- family keys, products.csv and the keyword rules below are
# unaffected by it. Two families in one BU may not share one, since they would then
# publish into a single repository. See docs/planning.md Phase 3.8.

version: "1.0"

business_units:
  tibco:
    name: "TIBCO"
    # `en-us-tib-messaging-userdocs`, not `en-us-tibco-...` -- the doc platform's
    # naming, on names that already carry a median-39-character product slug.
    repo_slug: "tib"
    families:
      integration:
        name: "Integration"
        description: "Application integration, API management, and event-driven architecture"
      messaging:
        name: "Messaging"
        description: "High-performance messaging, streaming, and pub-sub"
      analytics:
        name: "Analytics"
        description: "Visual analytics, data science, and streaming analytics"
      data_management:
        name: "Data Management"
        description: "Master data management and data virtualization"
      bpm:
        name: "Business Process Management"
        description: "Process automation, case management, and workflow"
      datasynapse:
        name: "DataSynapse"
        description: "GridServer grid computing and HPC workload management"
      # Declared from the keys products.csv already carries, heaviest first. These
      # were being auto-registered one warning at a time across 305 products; the
      # names are a transcription of what is in the catalog, not a re-grouping --
      # no product moved and no workspace path changed.
      bw-plugin:
        name: "BusinessWorks Plug-ins"
        description: "ActiveMatrix BusinessWorks plug-ins, connectors, and extensions"
      flogo-connectors:
        name: "Flogo Connectors"
        description: "Flogo connections and connectors to external services"
      businessconnect:
        name: "BusinessConnect"
        description: "B2B gateway, protocols, and trading-partner management"
      fulfillment:
        name: "Fulfillment"
        description: "Order management, fulfillment orchestration, and provisioning"
      loglogic:
        name: "LogLogic"
        description: "Log management, compliance suites, and security analytics"
      iprocess:
        name: "iProcess"
        description: "iProcess workflow engine, clients, and conductor"
      foresight:
        name: "Foresight"
        description: "Healthcare EDI validation, translation, and archiving"
      streaming:
        name: "Streaming"
        description: "StreamBase, LiveView, and enterprise streaming analytics"
      businessevents:
        name: "BusinessEvents"
        description: "Complex event processing, decision management, and data modeling"
      businessworks:
        name: "BusinessWorks"
        description: "The BusinessWorks integration engine and its editions"
      hawk:
        name: "Hawk"
        description: "Infrastructure monitoring agents, adapters, and plug-ins"
      activespaces:
        name: "ActiveSpaces"
        description: "In-memory data grid, its editions, and its connectors"
      ems:
        name: "EMS"
        description: "Enterprise Message Service clients for non-native platforms"
      platform:
        name: "Platform"
        description: "TIBCO Platform, Control Plane, and their add-ons"
      tra:
        name: "Runtime Agent"
        description: "Administrator, Designer, and the shared runtime agent"
      ftl:
        name: "FTL"
        description: "FTL and eFTL low-latency messaging"
      scribe:
        name: "Scribe"
        description: "Scribe cloud data integration"
      # Declared 2026-09-28 out of the 196-product `general` pile, which was the
      # largest bucket in the catalog and the one thing that could not become a
      # repository. Every member carries `family_source=manual`: these are hand
      # triage decisions, not rule output, and the rules below exist only so a
      # product discovered next quarter lands beside its siblings.
      adapters:
        name: "Adapters"
        description: "TIBCO and ActiveMatrix adapters, adapter service engines, and the adapter SDK"
      activematrix:
        name: "ActiveMatrix"
        description: "Service Grid, binding and implementation types, management agents, and Policy Director"
      int-platform:
        name: "Integration Platform"
        description: "TIBCO Integration, Hybrid Integration, and the connectivity add-ons"
      cloud:
        name: "TIBCO Cloud"
        description: "TIBCO Cloud services: API Modeler, Bus, Events, Messaging, Metadata, Passport"
      mft:
        name: "Managed File Transfer"
        description: "Command Center, Internet Server, and the platform servers"
      monitoring:
        name: "Monitoring"
        description: "RTView, Service Performance Manager, and IT operations analytics"
      mainframe:
        name: "Mainframe"
        description: "Mainframe WebUI, RED, TCP Library, Substation ES, and the z/OS transaction interfaces"
      openspirit:
        name: "OpenSpirit"
        description: "Geoscience data connectors, adapters, and the OpenSpirit runtime"
      silver-fabric:
        name: "Silver Fabric"
        description: "The Silver Fabric grid runtime and its enablers"
      silver-mobile:
        name: "Silver Mobile"
        description: "Silver Mobile server and the Android and iOS device cores"
      reward:
        name: "Reward"
        description: "Loyalty and customer reward marketing"
      general:
        name: "General"
        description: "Not yet triaged into a family"

  # Split out of `tibco` when the catalog was re-surveyed: the Spotfire products
  # answer to their own BU, so they publish to `en-us-spotfire-...` rather than
  # sitting under `tib`. `messaging` holds exactly one product (the ActiveSpaces
  # data source) and is declared so it is not an auto-registered ghost.
  spotfire:
    name: "Spotfire"
    families:
      analytics:
        name: "Analytics"
        description: "Visual analytics, data science, and streaming analytics"
      statistica:
        name: "Statistica"
        description: "Statistica advanced analytics and data science workbench"
      messaging:
        name: "Messaging"
        description: "Data sources bridging Spotfire onto the messaging products"

  onebx:
    name: "OneBX"
    families:
      data_management:
        name: "Data Management"
        description: "EBX master data management, on-premises and cloud"

  datasynapse:
    name: "DataSynapse"
    families:
      datasynapse:
        name: "DataSynapse"
        description: "GridServer grid computing and HPC workload management"
      general:
        name: "General"
        description: "Not yet triaged into a family"

  ibi:
    name: "ibi"
    families:
      webfocus:
        name: "WebFOCUS"
        description: "Business intelligence and enterprise reporting"
      data_management:
        name: "Data Management & Quality"
        description: "Omni-Gen and iWay data quality solutions"
      general:
        name: "General"
        description: "Not yet triaged into a family"

# Keyword inference. First match wins, so order matters -- put the specific rules
# above the broad ones. Each `match` token is compared case-insensitively against:
#   * the product_code, as an exact match; and
#   * the display name, as a substring.
# A product matching no rule is written as family_source=unclassified for manual
# triage. Rules never assign `engine`.
rules:
  # -- ibi ----------------------------------------------------------------
  - match: ["webfocus", "webfocus-app-studio", "webfocus-client", "webfocus-reporting-server"]
    bu: ibi
    family: webfocus
  # Above the mainframe rule below, which would otherwise claim it on `Mainframe
  # Connectors`; ibi owns the product regardless of what it connects to.
  - match: ["open data hub"]
    bu: ibi
    family: general
  - match: ["omni-gen", "omni-healthdata", "omni gen", "omni-healthdata", "iway", "dqm", "data quality center"]
    bu: ibi
    family: data_management

  # -- TIBCO messaging ----------------------------------------------------
  # Above the broad `activespaces` token in the messaging rule below, which was
  # claiming the whole ActiveSpaces line for `messaging`. The `activespaces`
  # family was declared but no rule reached it, so the five products sitting in
  # it were hand edits a fetch would have silently reverted.
  #
  # Deliberately *not* the bare substring "activespaces": it also matches
  # `spds-as` (Spotfire's data source, pinned to its own BU) and `bwpluginas`
  # (the BusinessWorks plug-in, which belongs to `bw-plugin`). The product codes
  # `as` and `ast` are just as unusable -- both are substrings of dozens of
  # unrelated display names -- so those two products match on a display-name
  # phrase that is unique to each.
  - match:
      - "activespaces® - enterprise edition"
      - "activespaces® transactions"
      - "sfas"
      - "activespaces-remote"
      - "activespaces-addon"
      - "msg-ap2as"
      - "activespaces-connector-for-apache-kafka-enterprise-edition"
    bu: tibco
    family: activespaces

  - match: ["ems", "enterprise message service", "ftl", "rendezvous", "activespaces"]
    bu: tibco
    family: messaging

  # -- TIBCO integration --------------------------------------------------
  - match:
      - "businessevents-enterprise"
      - "businessevents"
      - "bw"
      - "bwce"
      - "businessworks"
      - "flogo"
      - "api-exchange"
      - "api exchange"
    bu: tibco
    family: integration

  # -- Spotfire -----------------------------------------------------------
  # Above the TIBCO rules and split off them: these tokens used to resolve to
  # `bu: tibco`, which is now contradicted by the BU the products actually carry.
  # `streambase` stays with TIBCO -- its products sit in `tibco`/`streaming`.
  - match: ["statistica"]
    bu: spotfire
    family: statistica
  - match: ["spotfire"]
    bu: spotfire
    family: analytics

  # -- TIBCO analytics ----------------------------------------------------
  - match: ["streambase"]
    bu: tibco
    family: analytics

  # -- the 2026-09-28 families --------------------------------------------
  # Placed *below* the messaging / integration / Spotfire rules on purpose. Several
  # of these products are a plug-in or an enabler named after two families at once
  # -- `BusinessWorks Plug-in for Managed File Transfer`, `Silver Fabric Enabler for
  # EMS`, `Spotfire Extension for OpenSpirit` -- and the catalog puts every one of
  # them with the product it extends, not with the product it names. Reading the
  # rules top-down gives exactly that, where reading them bottom-up does not.
  #
  # Measured against all 669 catalogued products on 2026-09-28: these rules move
  # 188 verdicts and 186 of them land on the family a human curated. The two that
  # do not are both cross-named and both pinned `manual` in products.csv --
  # `Silver Fabric Enabler for BusinessConnect` (curated silver-fabric) and
  # `Administrator - Enterprise Edition Distribution for Silver Fabric` (curated
  # tra). No token ordering fixes one without breaking its mirror image.
  #
  # A note on the tokens, because it is not guessable from the rule syntax: the
  # name half of a match is a **raw lowercase substring** of `display_name`, and
  # nearly every product name carries a `®` or `™` *inside* it. So `silver fabric`
  # matches nothing -- the real name is `TIBCO Silver® Fabric` -- and `activematrix
  # adapter` matches nothing either. Tokens here never span the symbol position,
  # which is why several are a single word or an exact `product_code`.
  # Ahead of `businessconnect`: `Foresight BusinessConnect Insight` is a Foresight
  # product that names the gateway it reads from.
  - match: ["foresight"]
    bu: tibco
    family: foresight
  # Ahead of `fabric` and of OneBX's `ebx`: a BusinessConnect protocol or a
  # BusinessConnect distribution is a BusinessConnect product either way.
  - match: ["businessconnect", "partnerexpress"]
    bu: tibco
    family: businessconnect
  # Ahead of `adapters`: the Fulfillment provisioning clients are named
  # `... Client Adapter for BSCS`, and they are fulfillment components.
  - match: ["fulfillment"]
    bu: tibco
    family: fulfillment
  # `fabric`, not `silver fabric` -- see the symbol note above.
  - match: ["fabric"]
    bu: tibco
    family: silver-fabric
  - match: ["silver mobile", "silver-mobile-server", "silver-mobile-core-for-android", "silver-mobile-core-for-ios"]
    bu: tibco
    family: silver-mobile
  - match: ["openspirit"]
    bu: tibco
    family: openspirit
  - match: ["mainframe", "substation", "transaction interface", "object service broker", "ziip"]
    bu: tibco
    family: mainframe
  - match: ["managed file transfer"]
    bu: tibco
    family: mft
  - match: ["rtview", "service performance manager", "it-oa-suite", "mon-suite"]
    bu: tibco
    family: monitoring
  # Above `adapters`: `Binding Type for Adapters` and `Implementation Type for
  # TIBCO Adapters` are ActiveMatrix runtime pieces, not adapters.
  - match: ["service grid", "binding type", "implementation type", "management agent", "policy director", "uddi"]
    bu: tibco
    family: activematrix
  - match: ["adapter for", "adapter service engine", "adapter framework", "adapter sdk", "adapter migration"]
    bu: tibco
    family: adapters
  - match: ["reward"]
    bu: tibco
    family: reward
  - match:
      - "hybrid integration"
      - "tibco-int"
      - "ai-suite"
      - "int-cn-addon-suite"
      - "cn-addon-itg-suite"
      - "b2b-addon-itg-suite"
      - "tp-integration"
      - "tp-integration-conn"
      - "tci-hybrid"
      - "cloud-integration-sku"
      - "cloud-int-connectivity"
    bu: tibco
    family: int-platform
  # Exact codes only. The `®` sits between `Cloud` and the service name, so there
  # is no usable name substring, and a bare `cloud` would swallow every product
  # with a Cloud Edition.
  - match:
      - "cloud-administration"
      - "tcam"
      - "cloud-bus"
      - "cloud-data-streams"
      - "cloud-events"
      - "tcisf"
      - "cloud-integration-ipaas"
      - "cloud-messaging"
      - "cloud-metadata"
      - "cloud-passport"
    bu: tibco
    family: cloud

  # -- OneBX --------------------------------------------------------------
  # All four EBX products moved out of `tibco`/`data_management` with the BU.
  - match: ["ebx", "cloudebx", "ebx-addon", "ebx-cloud-enterprise"]
    bu: onebx
    family: data_management

  # -- TIBCO data management ----------------------------------------------
  - match: ["mdm", "tdv", "data virtualization"]
    bu: tibco
    family: data_management

  # -- TIBCO BPM ----------------------------------------------------------
  - match: ["activematrix-bpm", "iprocess", "nimbus"]
    bu: tibco
    family: bpm

  # -- ibi catch-all ------------------------------------------------------
  # Deliberately last: broad enough to misfire against a more specific rule above.
  - match: ["ibi"]
    bu: ibi
    family: general
