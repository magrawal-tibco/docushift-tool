# Rejected candidates, kept so the next reviewer inherits the evidence rather than
# re-deriving it. All six were proposed by a prefix-tolerant matcher and all six
# share no version with the catalog product, so none of them would retire a row.
#
#   Spotfire Analytics           -> tibco-analytics    0/7   WRONG. The report lists
#       14.0.7-14.8.0 and the catalog holds 7.x and 10.x. Produced by stripping
