# End-of-support exclusions -- docs/architecture.md 3.11.
#
# Support publishes a retirement report; a version it marks `Retired` is never
# converted. This file is the authored half: which report is active, and how its
# product names map to catalog slugs where the name alone does not resolve.
#
# THE REPORT'S ONLY JOIN KEY IS THE DISPLAY NAME. It carries no slug and no
# product_code. A name is matched by slugifying it and testing the result against
# `products.csv` by STRING EQUALITY -- the same rule scope.yaml uses, for the same
# reason. Anything that does not match exactly must be listed under `aliases:`
# below, by hand, after review. There is deliberately no fuzzy fallback.
#
# ABSENCE NEVER RETIRES ANYTHING. 2,506 of the catalog's 4,462 versions have no
# row in this report -- 2,004 of them because the product is absent from it
# entirely, and most of the rest because the version is newer than anything the
# report lists. Only an explicit `Retired` row excludes; `Retirement Announced`
# and `GA` still convert.
#
# A NEW REPORT IS A NEW FILE, not an overwrite. Point `report:` at it and run
# `docushift catalog eos`. The dated filename is what makes the change a
# reviewable diff rather than a silent re-decision of a thousand rows.

report: eos/EOS-Report-2026-09-10.csv

# Report names that do not slugify to a catalog slug, reviewed one at a time.
#
# `shared` records how many of the report's versions for that name are also in the
# catalog for that slug, measured on 2026-09-10. It is the evidence for the entry,
# not something the tool reads -- but it is why each of these is here: a rename is
# proved by the two sides describing the same releases.
#
# One-directional evidence, worth knowing before adding an entry. A shared version
# proves an alias; zero shared versions does NOT disprove a match -- 13 of the 237
# names that match a slug exactly also share no version, and every one of them is
# plainly the right product whose report and docsite simply list different
# releases. But since absence retires nothing, an alias with no shared version
# changes no row today, which makes writing it speculation rather than caution.
# Hence the rule this list was built on: only aliases with evidence.

aliases:
  - report_name: "TIBCO Data Streams"
    slug: spotfire-data-streams
    note: "Renamed to Spotfire Data Streams; shared 16/16"
  - report_name: "Spotfire Data Science Team Studio"
    slug: tibco-data-science-team-studio
    note: "Vendor prefix flipped Spotfire <-> TIBCO; shared 5/5"
  - report_name: "DataSynapse High-Performance Computing Cloud Adapter"
    slug: tibco-datasynapse-high-performance-computing-cloud-adapter
    note: "Report drops the TIBCO prefix; shared 5/5"
  - report_name: "EBX"
    slug: tibco-ebx
    note: "Report drops the TIBCO prefix; shared 49/55"
  - report_name: "Spotfire Analytics Server"
    slug: tibco-spotfire-analytics-server
    note: "Report drops the TIBCO prefix; shared 2/9"
  - report_name: "Spotfire Business Author"
