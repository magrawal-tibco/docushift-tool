# Where we stand: the hand-kept part of the status page (closeout plan §8b).
#
# Claude updates this file with the morning note; scratch/build_conversion_status.py
# reads it and writes the "Where we stand" tab of reports/conversion-status.html and
# reports/status-latest.md. Counts (versions, problem kinds, story points, open Jira
# issues) are read from the data, never typed here.
#
# Per area:
#   name        plain words; a business reader sees it
#   team        TechDocs, Digital Platform or Engineering (no other names)
#   status      done, on track, at risk or blocked
#   note        one sentence: why that status (plain words, no release codes)
#   plan        the closeout-plan section it comes from
#   next        the next date (YYYY-MM-DD), or plain words such as "after 30 Nov"
#   next_step   what happens on that date
#   jira        DOCOPS keys; a story or epic also counts the sub-tasks under it
#   jira_labels Jira labels whose sub-tasks count here (after keys named anywhere)
#   measure     which counted "done and left" to show: conversion, publishing,
#               staging_checks, problems or karan; otherwise its Jira items done
#   waiting_on  what another team (or this one) owes, with a date
#
# A sub-task counts under one area only: named in `jira` first, then by label,
# then by its nearest named parent; the first area listed wins. The rest shows as
# "Building the conversion tool, and earlier work".
#
# Format: a small subset of YAML (one-line values; quote a value holding ": " or "#").

go_live: 2026-11-23
old_site_off: 2026-11-30

# Who owns a Jira issue when it is not the area's own team. A logged problem kind
# follows its issue's owner here (closeout plan §4: AEM-side items).
jira_owner:
  DOCOPS-255: Digital Platform
  DOCOPS-344: Digital Platform
  DOCOPS-345: Digital Platform
  DOCOPS-346: Digital Platform
  DOCOPS-351: Digital Platform
  # §4 lists 353 as AEM-side; jira.md (12 Nov) notes it is mostly ours, fixed by 360. To confirm.
  DOCOPS-353: TechDocs
  DOCOPS-355: Engineering
  DOCOPS-356: Engineering
  DOCOPS-357: Engineering
  DOCOPS-358: Engineering
  DOCOPS-359: Digital Platform
  DOCOPS-279: TechDocs
  DOCOPS-322: TechDocs
  DOCOPS-354: TechDocs

areas:
