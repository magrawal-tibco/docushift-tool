# STATUS (15 Nov): entries marked '# pending move' are switched off until their family's
# repos are moved with scratch/move_publish_folders.py; until then sync and verify must use
# the folder that is actually published. Un-comment a family's lines in the same commit
# as its move. Pending: bw-plugin (waits for AEM's answer), businessworks, platform, streaming (R2).
#
# Publish names -- the folder a product publishes under, when it is not its slug
# (planning.md Phase 80, decision D8; DOCOPS-372).
#
# Why: AEM cuts a product's folder name in a URL after 50 characters. A longer
# folder is served at a truncated address, and products sharing their first 50
# characters are served at one address (one overwrites the other). Each product
# below publishes under a shorter folder instead:
#   en-us/<folder>/online-help/... in the docs repo, en-us/<folder>/archives and
#   api-references/... in the -resources repo, and every served address formed
#   from them (redirects.yml, 301.yml, csh.yml, the DAM paths, verify's URLs).
#
# The catalog slug on the left stays the key everywhere else: the workspace
# (output/, reframed/), state.db, versions.csv and every report.
#
# Generated from reports/url-names/proposal-2026-11-14-v2.csv (approved by the
# user 2026-11-14): the 92 products over 50 characters, plus the 16 shorter BW
# plug-ins so the whole family is tibco-bw-plugin-... . Products not listed
# publish under their slug, as before.
#
# Rules, checked on load (ConfigManager.load_publish_names): each folder is at
# most 50 characters of lowercase letters, digits and hyphens; no two products
# share a folder; no folder is another product's slug. `validate` raises
# PUBLISH_NAME_TOO_LONG for any published folder over 50; `catalog fetch` warns
# (PUBLISH_NAME_MISSING) for an in-scope product over 50 with no entry here.
#
# Changing an entry for a product already published: move its folders first
# (scratch/move_publish_folders.py), then sync.

