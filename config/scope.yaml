# Products that are never converted -- docs/architecture.md 3.10.
#
# Every entry is matched against a product's `slug` column in products.csv by
# STRING EQUALITY. Never a substring: `ebx` also occurs in
# `tibco-businessconnect-ebxml-protocol` (an unrelated B2B standard) and in
# `tibco-product-and-service-catalog-powered-by-tibco-ebx`, and `spotfire` also
# occurs in 16 public products that are in scope, among them the whole Data
# Science and Statistica lines. Never a display name either: names arrive
# mojibaked through copy-and-paste, and slugify() folds the trademark symbols
# away, so two distinct names can collide on one slug.
#
# `display_name` is documentation, not a matching key. It is here so a reader can
# tell what a slug is, and so a rule that stops matching (an upstream rename) can
# be traced back to a product. Every fetch reports rules that matched nothing.
#
# A merge re-applies this file to every product it touches, new ones included, so
# a version discovered after an entry was written is excluded on arrival. Removing
# an entry restores the product to scope on the next fetch. To exempt a single
# product without editing this file, run
# `docushift catalog set --product <code> --in-scope`, which records
# scope_source=manual and outranks everything here.
#
# 61 products, each verified against the live docs.tibco.com A-to-Z index on
# 2026-09-09: 61/61 matched 1:1, all publicly visible, 0 ambiguous.

